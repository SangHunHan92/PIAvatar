# PIAvatar conda environment (verified on Ubuntu 20.04, RTX 4090, driver 535 / CUDA 11.8)
name: piavatar
channels:
  - pytorch
  - nvidia/label/cuda-11.8.0
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - cuda-toolkit=11.8          # nvcc 11.8 for building the CUDA extensions
  - cuda-nvcc=11.8.89
  - gcc_linux-64=11            # gcc 9–11 are compatible with nvcc 11.8
  - gxx_linux-64=11
  - libstdcxx-ng>=13           # GLIBCXX_3.4.29+ required by kaolin / open3d wheels
  - faiss-gpu=1.7.4            # AnimatableGaussians
  - ffmpeg
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - -r requirements.txt
variables:
  TORCH_CUDA_ARCH_LIST: "7.0;7.5;8.0;8.6;8.9;9.0"
